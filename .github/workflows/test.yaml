name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.23.x]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.work.sum

      - name: Fmt
        run: "diff <(gofmt -d .) <(printf '')"
        shell: bash

#      - name: Vet
#        run: |
#          go vet ./core/...
#          go vet ./gha-runner/...

      - name: Test
        run: go list -m | xargs -I {} go test "{}/..."
