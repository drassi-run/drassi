on:
  push:
    branches: [main]
  pull_request:
name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.21.x, 1.22.x] # test with 2 most recent go versions
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install golint
        run: go install golang.org/x/lint/golint@latest
        shell: bash

      - name: Update PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        shell: bash

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fmt
        run: "diff <(gofmt -d .) <(printf '')"
        shell: bash

      - name: Vet
        run: |
          go vet ./core/...
          go vet ./gha-runner/...

      - name: Lint
        run: golint ./...

      - name: Test
        run: go test -race ./...