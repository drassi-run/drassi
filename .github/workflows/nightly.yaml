name: Nightly Build

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write  # Needed for creating/updating releases
  packages: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main  # Explicitly checkout main branch
          fetch-depth: 0  # Required for GoReleaser

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: go.work.sum

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: 'v0.105.0'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate version and date
        id: version
        run: |
          # Get commit timestamp in YYYYMMDDHHmmss format (same as GoReleaser)
          TIMESTAMP=$(git log -1 --format=%cd --date=format:%Y%m%d%H%M%S)
          echo "VERSION=0.0.0-nightly-${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "DATE=$(git log -1 --format=%cd --date=format:%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # TODO: nightly is a goreleaser's Pro feature so we will have to do a workaround to push the images to the registry

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Nightly Build (${{ steps.version.outputs.DATE }})"
          body: |
            🌙 Nightly build from main branch - ${{ steps.version.outputs.DATE }}

            ⚠️ **Note:** This nightly release is automatically built every day. We recommend using tagged releases instead.

          prerelease: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
